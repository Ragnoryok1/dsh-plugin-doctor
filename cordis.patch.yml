# @ragnoryok1/dsh-plugin-doctor profile-bundle patch.
# Adds the diagnostics panel as a dynamic client-plugin row. Composed at profile
# boot; the dsh-client-modules host serves lib/client.js via the combo
# /plugins/??<id>/client.js route. The row name resolves to this package, which
# declares dsh.client (platform web) and exports ./client.
- insert:
    - id: plugin-doctor
      name: '@ragnoryok1/dsh-plugin-doctor'
