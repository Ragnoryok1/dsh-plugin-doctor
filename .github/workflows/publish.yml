name: publish

# Releases are cut by tag only: npm credentials live in repository secrets, so a
# release never needs a token pasted into a chat, a shell, or a local .npmrc.
#
#   npm version 0.2.0 --no-git-tag-version
#   # bump the version in the deepseek-harness-meta block of README.md too
#   git commit -am "release: 0.2.0" && git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every check but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag_version but package.json says $pkg_version"
            exit 1
          fi

      # The marketplace reads the version from this block, and it reads it once
      # at first listing — so drift here never announces itself.
      - name: Check the README metadata version matches package.json
        run: |
          node -e "
            const fs = require('node:fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            const block = readme.match(/<!--\s*deepseek-harness-meta\s*([\s\S]*?)-->/);
            if (!block) { console.error('::error::no deepseek-harness-meta block in README.md'); process.exit(1); }
            let meta;
            try { meta = JSON.parse(block[1]); } catch (error) { console.error('::error::meta block is not valid JSON:', error.message); process.exit(1); }
            const pkg = require('./package.json').version;
            if (meta.version !== pkg) {
              console.error('::error::README meta version ' + meta.version + ' != package.json ' + pkg);
              process.exit(1);
            }
            console.log('README meta version ' + meta.version + ' matches package.json');
          "

      # The three READMEs describe one document; this gate fails when an edit
      # touches one language and leaves the others behind.
      - name: Check the READMEs stay in step
        run: npm run check:readmes

      - name: Build
        run: npm run build

      - name: Show what would be published
        run: npm pack --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
